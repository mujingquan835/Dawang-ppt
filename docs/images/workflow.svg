<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="350" viewBox="0 0 1440 350" role="img" aria-labelledby="title desc"><title id="title">Dawang-PPT 制作方法示意</title><desc id="desc">理解材料，形成可上屏文案，按内容关系自主设计，编辑并逐页复核，交付一个可离线编辑的HTML。示意图，不是产品界面。</desc><rect width="1440" height="350" fill="#F7F3E8"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="56" y="68" fill="#123B2F" font-size="32" font-weight="700">从读者任务出发，把内容、设计和交付连起来。</text><path d="M 70 145 H 1366" fill="none" stroke="#B5BDAF" stroke-width="2"/><g fill="#123B2F"><circle cx="70" cy="145" r="7"/><circle cx="345" cy="145" r="7"/><circle cx="620" cy="145" r="7"/><circle cx="895" cy="145" r="7"/><circle cx="1170" cy="145" r="7"/></g><g fill="#8B6A26" font-size="22"><text x="70" y="118">01</text><text x="345" y="118">02</text><text x="620" y="118">03</text><text x="895" y="118">04</text><text x="1170" y="118">05</text></g><g fill="#123B2F" font-size="29" font-weight="700"><text x="70" y="209">理解材料</text><text x="345" y="209">上屏文案</text><text x="620" y="209">自主设计</text><text x="895" y="209">编辑与复核</text><text x="1170" y="209">单 HTML 交付</text></g><g fill="#56685D" font-size="21"><text x="70" y="256">受众、事实、证据</text><text x="345" y="256">主线、重点、限定</text><text x="620" y="256">关系、层级、取景</text><text x="895" y="256">修改、保存、看图</text><text x="1170" y="256">离线打开，继续改</text></g><text x="56" y="318" fill="#56685D" font-size="18">制作方法示意；其他格式按需导出。每次制作仍需按具体材料判断。</text></g></svg>
